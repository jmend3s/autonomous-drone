ekf_local:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /imu/data
    imu0_config: [false, false, false,   # position (x y z)
                  true,  true,  true,    # orientation (r p y)
                  false, false, false,   # linear velocity
                  true,  true,  true,    # angular velocity
                  true,  true,  true]    # linear acceleration
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

navsat_transform:
  ros__parameters:
    frequency: 30.0
    wait_for_transform: true
    base_link_frame: base_link
    gps_frame: base_link
    odom_frame: odom
    world_frame: map
    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: false
    use_odometry_yaw: false

ekf_global:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.2
    two_d_mode: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]

    pose0: /gps/odom
    pose0_config: [true, true, true,      # position
                   false, false, false,   # orientation (IMU gives that)
                   false, false, false,   # linear velocity
                   false, false, false]   # angular velocity
    pose0_relative: false