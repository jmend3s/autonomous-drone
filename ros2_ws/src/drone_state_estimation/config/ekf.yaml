ekf_local:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.5
    two_d_mode: false
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /imu/data
    imu0_config: [false, false, false,   # position (x y z)
                  true,  true,  true,    # orientation (r p y)
                  false, false, false,   # linear velocity
                  true,  true,  true,    # angular velocity
                  true,  true,  true]    # linear acceleration
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    odom0: /drone/odom
    odom0_config: [ true,  true,  true,      # position x y z
                    false, false, false,     # orientation (IMU already gives it)
                    true,  true,  true,      # linear velocity
                    false, false, false ]     # angular velocity

    publish_state: true
    publish_acceleration: false

navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0

    wait_for_transform: true
    base_link_frame: base_link
    odom_frame: odom
    world_frame: map

    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true

    use_odometry_yaw: false
    wait_for_datum: false

    publish_filtered_gps: true
    filtered_gps_topic: "/odometry/gps_navsat"

    gps0: /odometry/gps
    gps0_config: [ true, true, true,
                   false, false, false,
                   false, false, false,
                   false, false, false ]

ekf_global:
  ros__parameters:
    use_sim_time: true
    frequency: 10.0
    sensor_timeout: 0.2
    two_d_mode: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    imu0: /imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    odom0: /odometry/gps_navsat
    odom0_config: [true, true, false,     # ← disable Z
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_relative: false

    publish_state: true
    publish_acceleration: false


