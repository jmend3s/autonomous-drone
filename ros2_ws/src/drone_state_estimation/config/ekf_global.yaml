
ekf_global:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    imu0: /imu/data
    imu0_config: [false, false, false,   # x y z position
                  false, false, true,    # roll pitch yaw
                  false, false, false,   # linear velocity
                  false, false, true,    # angular velocity
                  false, false, false]   # linear acceleration

    imu0_differential: false
    imu0_remove_gravitational_acceleration: true

    odom0: /odometry/gps_navsat
    odom0_config: [true,  true,  false,   # position x y z
                   false, false, false,   # orientation
                   false, false, false,   # linear velocity
                   false, false, false]   # angular velocity
    odom0_relative: false

    publish_state: true
    publish_acceleration: false
