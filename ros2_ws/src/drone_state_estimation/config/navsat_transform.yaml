
navsat_transform:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0

    wait_for_transform: true
    base_link_frame: base_link
    odom_frame: odom
    world_frame: map

    magnetic_declination_radians: 0.0
    yaw_offset: 0.0
    zero_altitude: true

    use_odometry_yaw: false
    wait_for_datum: false

    publish_filtered_gps: true
